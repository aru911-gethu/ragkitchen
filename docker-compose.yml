services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognitive_kitchen_api
    restart: always
    network_mode: host
    command: uvicorn cognitive_kitchen.api:app --host 0.0.0.0 --port 8010
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognitive_kitchen_ui
    restart: always
    network_mode: host
    command: streamlit run src/cognitive_kitchen/ui/app.py --server.port=8501 --server.address=0.0.0.0
    env_file:
      - .env
    volumes:
      - ./data:/app/data
